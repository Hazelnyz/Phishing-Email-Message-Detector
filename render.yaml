services:
  - type: web
    name: phishguard-ai
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --bind 0.0.0.0:$PORT --workers 1 --threads 4 --timeout 120 app:app
    healthCheckPath: /
    envVars:
      - key: CHAT_ENABLED
        value: "false"
      - key: FLASK_DEBUG
        value: "0"
